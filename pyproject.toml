[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slop-no-more"
version = "0.2.1"
description = "Deterministic linter for configured English prose patterns, with inspectable findings and editorial repairs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "calebstacy" }]
keywords = ["ai-slop", "prose-lint", "writing", "style", "rhetoric", "ci", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
slop = "slop_no_more.cli:main"

[project.urls]
Homepage = "https://github.com/calebstacy/slop-no-more"
Issues = "https://github.com/calebstacy/slop-no-more/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
