# Drop-in prose policy for any repo. This example fails when a configured
# high- or medium-severity pattern lands in the selected prose.
#
# Copy into .github/workflows/slop-gate.yml, edit the paths and choose the
# threshold your team has actually adopted. The scanner and actions are pinned
# so the policy cannot change underneath an existing pull request.

name: slop-gate
on:
  pull_request:
    paths: ["**/*.md"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "git+https://github.com/calebstacy/slop-no-more@v0.2.0"
      - run: slop scan docs/ README.md --fail-on medium
